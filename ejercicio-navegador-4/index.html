<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ejercicio Navegador 4</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main class="app">
    <h2>Convertir Celsius a Fahrenheit</h2>
    <form id="celsius-form">
      <input type="number" id="celsius-input" placeholder="Celsius" required />
      <button id="celsius-convert" type="button">Convertir</button>
    </form>
    <div id="celsius-result" class="contenedor"></div>
    <h2>Convertir Fahrenheit a Celsius</h2>
    <form id="fahrenheit-form">
      <input type="number" id="fahrenheit-input" placeholder="Fahrenheit" required />
      <button id="fahrenheit-convert" type="button">Convertir</button>
    </form>
    <div id="fahrenheit-result" class="contenedor"></div>
  </main>
</body>
</html>
